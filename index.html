<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gezinsagenda</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff7a59"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2b2b;--muted:#8a8478;--line:#e8e2d8;--accent:#3a7bd5;--today:#e8f0fc;--sel:#d6e4fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--text:#eee;--muted:#9a9a9a;--line:#33363a;--accent:#6aa3f0;--today:#1f2b3d;--sel:#2a3c58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--text:#eee;--muted:#9a9a9a;--line:#33363a;--accent:#6aa3f0;--today:#1f2b3d;--sel:#2a3c58;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{padding:14px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 14px;min-height:44px}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.tabs button{padding:8px 4px}
.chip{border-radius:20px;padding:6px 12px;min-height:38px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
h1{font-size:1.5rem;margin:0}h2{font-size:1.15rem;margin:0 0 8px;text-transform:capitalize}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.head h2{margin:0;flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--muted);font-size:.85rem}
.day{min-height:62px;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer;overflow:hidden}
@media (min-width:800px){.day{min-height:96px}}
.day.other{opacity:.4}.day.today{background:var(--today)}.day.sel{background:var(--sel);border-color:var(--accent)}
.ev{font-size:.72rem;color:#fff;border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{overflow-x:auto}.week{min-width:720px}
.wcol{border:1px solid var(--line);border-radius:10px;padding:6px;min-height:140px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}
.item.done span{text-decoration:line-through;color:var(--muted)}
.bar{border-left:6px solid;padding-left:10px}
small,.note{color:var(--muted);font-size:.85rem}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-height:44px;max-width:100%}
input[type=color]{padding:2px;width:52px}
input.w{flex:1;min-width:120px}
.x{padding:4px 10px;min-height:36px}
.chk{width:28px;height:28px;border-radius:8px;padding:0;min-height:28px}
.clk{font-size:5rem;font-weight:700;line-height:1}.wd{font-size:1.4rem;color:var(--muted);text-transform:capitalize;margin-bottom:14px}.wgrid{display:grid;gap:12px;grid-template-columns:1fr}@media (min-width:800px){.wgrid{grid-template-columns:1fr 1fr}.clk{font-size:7rem}}.big{font-size:1.4rem}.wgrid .chk{width:40px;height:40px;min-height:40px;font-size:1.3rem}

:root{--bg:#fff4e6;--accent:#ff7a59;--sel:#ffe0d6;--today:#fff0c9}
html,body{font-family:Nunito,"Trebuchet MS",system-ui,sans-serif}
body{padding:14px 14px 96px}
.card{border-radius:24px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
button{border-radius:16px;font-weight:800}
#hd{text-transform:capitalize}.wm #hd{font-size:3rem}
.tabs{position:fixed;z-index:20;display:flex;gap:4px;left:0;right:0;bottom:0;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;line-height:1.1}
.tabs button b{font-size:1.5rem}.tabs button.on{background:var(--sel);color:var(--text)}
@media (min-width:800px){body{padding:16px 16px 16px 104px}.tabs{top:0;bottom:auto;right:auto;width:88px;flex-direction:column;justify-content:flex-start;padding:calc(12px + env(safe-area-inset-top,0px)) 6px;border-top:0;border-right:1px solid var(--line)}.fab{bottom:24px!important}}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{border-radius:28px;padding:12px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:var(--card);flex:none}
.pn{font-size:1.5rem;font-weight:800}
.pill{display:inline-block;background:var(--card);border-radius:20px;padding:3px 12px;font-weight:800;font-size:.95rem}
.part{font-weight:800;margin:12px 4px 6px;font-size:1.05rem}
.t{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:22px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:76px;box-shadow:0 3px 0 rgba(0,0,0,.07)}
.t.done{opacity:.7}.t.done .tt{text-decoration:line-through}
.tt{font-weight:800;font-size:1.15rem}
.ck{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-size:1.6rem;background:var(--card)}
.fab{position:fixed;right:18px;bottom:92px;width:62px;height:62px;border-radius:50%;background:#3a7bd5;color:#fff;font-size:2rem;padding:0;z-index:15;border:0;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mb{background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
@media (min-width:800px){.ov{align-items:center}.mb{border-radius:24px}}
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none}.toast{background:#3a7bd5;color:#fff;padding:12px 18px;border-radius:18px;font-weight:800;max-width:90vw;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#ss{position:fixed;inset:0;z-index:300;background:#000;display:flex;align-items:center;justify-content:center}
#ssi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ssc{position:absolute;left:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));color:#fff;text-shadow:0 2px 8px #000;font-size:1.3rem;text-transform:capitalize}
.bigc{font-size:4.5rem;font-weight:800;line-height:1}
#ss.dim #ssc{left:0;right:0;bottom:auto;text-align:center;opacity:.35}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:250;border-radius:2px;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.gm{grid-template-columns:28px repeat(7,1fr)}.wkn{display:grid;place-items:center;color:var(--muted);font-size:.8rem;font-weight:800}
</style>
</head>
<body>
<div class="head"><h1 id="hd">Gezinsagenda</h1><span id="wx" style="font-weight:800;white-space:nowrap"></span><small id="note"></small><button id="meb" style="min-height:40px;padding:4px 12px" aria-label="Profiel">👤</button><button id="bell" style="min-height:40px;padding:4px 12px" aria-label="Meldingen">🔔</button><button id="th" style="min-height:40px;padding:4px 12px" aria-label="Thema wisselen">🌓</button></div>
<div id="app"></div>
<div class="note" style="text-align:center;margin:16px 0 90px">Versie 11</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var data={people:[],events:[],tasks:[],items:[],meals:[],rewards:[],feeds:[]},db=null,dirty=false;
var S={tab:"agenda",view:"maand",sel:iso(new Date()),who:"",addp:false};
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function D(k){return new Date(k+"T12:00:00")}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function $(i){return document.getElementById(i)}
function val(i){var e=$(i);return e?e.value.trim():""}
function col(id){var p=data.people.find(function(x){return x.id===id});return p?p.color:"#8a8478"}
function pname(id){var p=data.people.find(function(x){return x.id===id});return p?p.name:""}
function note(t){$("note").textContent=t}
function add(c,o){if(db){db.collection(c).add(o).catch(function(){note("Opslaan mislukt (schrijfrechten?)")})}else{o.id="l"+Math.random();data[c].push(o);render()}}
function del(c,id){if(db){db.collection(c).doc(id).delete().catch(function(){note("Wissen mislukt")})}else{data[c]=data[c].filter(function(x){return x.id!==id});render()}}
function put(c,id,o){if(db){db.collection(c).doc(id).set(o).catch(function(){note("Opslaan mislukt")})}else{o.id=id;var i=data[c].findIndex(function(x){return x.id===id});if(i<0)data[c].push(o);else data[c][i]=o;render()}}
function upd(c,id,patch){var it=data[c].find(function(x){return x.id===id});if(!it)return;var n={};for(var k in it)if(k!=="id")n[k]=it[k];for(var k2 in patch)n[k2]=patch[k2];put(c,id,n)}
function hits(e,k){if(e.date===k)return true;if(!e.rep||k<e.date)return false;var a=D(e.date),b=D(k);
  if(e.rep==="d")return true;
  if(e.rep==="w")return Math.round((b-a)/864e5)%7===0;
  if(e.rep==="m")return a.getDate()===b.getDate();
  if(e.rep==="y")return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  return false}
function evs(k){return data.events.filter(function(e){return hits(e,k)&&(!S.who||e.who===S.who)}).concat(EXT.filter(function(e){return e.date===k&&(!S.who||e.who===S.who)})).sort(function(a,b){return (a.time||"").localeCompare(b.time||"")})}
function chip(e){return '<div class="ev" style="background:'+col(e.who)+'">'+(e.time?esc(e.time)+" ":"")+(e.ext?"📚 ":"")+esc(e.title)+(e.rep?' ↻':'')+'</div>'}
function nopts(a,b,st){var h="";for(var i=a;i<=b;i+=st)h+='<option>'+String(i).padStart(2,"0")+'</option>';return h}
function opts(){return data.people.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join("")}
function wk(d){var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);var y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y)/864e5+1)/7)}
function mon(k){var x=D(k);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function people(){
  var h='<div class="row" style="margin-bottom:10px"><button class="chip'+(S.who?"":" on")+'" data-a="who" data-id="">Iedereen</button>';
  data.people.forEach(function(p){h+='<button class="chip'+(S.who===p.id?" on":"")+'" data-a="who" data-id="'+esc(p.id)+'">'+esc(p.emoji||"🙂")+' '+esc(p.name)+'</button>'});
  h+='<button class="chip" data-a="addp">+ Persoon</button></div>';
  if(S.addp||!data.people.length)h+='<div class="card row"><input class="w" id="pn" placeholder="Naam (bijv. Mama)"><select id="pe">'+"🐶🐱🦊🐸🦁🐼🦄🐯🐰🐵".match(/./gu).map(function(e){return '<option>'+e+'</option>'}).join("")+'</select><input type="color" id="pc" value="#ff7a59"><button class="primary" data-a="savep">Opslaan</button></div>';
  return h}
function agenda(){
  var h='<div class="row" style="margin-bottom:10px">'+["dag","week","maand"].map(function(v){return '<button class="'+(S.view===v?"on":"")+'" data-a="view" data-v="'+v+'">'+v+'</button>'}).join("")+'</div><div class="card"><div class="head"><button data-a="nav" data-n="-1">‹</button>';
  var d=D(S.sel),t;
  if(S.view==="maand")t=d.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
  else if(S.view==="week"){var m=mon(S.sel),e=new Date(m);e.setDate(m.getDate()+6);t="Week "+wk(m)+" · "+m.getDate()+" – "+e.toLocaleDateString("nl-NL",{day:"numeric",month:"long"})}
  else t=d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"});
  h+='<h2>'+t+'</h2><button data-a="nav" data-n="0">Vandaag</button><button data-a="nav" data-n="1">›</button></div>';
  var today=iso(new Date());
  if(S.view==="maand"){
    var f=new Date(d.getFullYear(),d.getMonth(),1,12),st=new Date(f);st.setDate(1-((f.getDay()+6)%7));
    h+='<div class="grid gm"><div class="dow">wk</div>'+["ma","di","wo","do","vr","za","zo"].map(function(x){return '<div class="dow">'+x+'</div>'}).join("")+'</div><div class="grid gm" style="margin-top:4px">';
    for(var i=0;i<42;i++){var x=new Date(st);x.setDate(st.getDate()+i);var k=iso(x),l=evs(k);if(i%7===0)h+='<div class="wkn">'+wk(x)+'</div>';
      h+='<div class="day'+(x.getMonth()!==d.getMonth()?" other":"")+(k===today?" today":"")+(k===S.sel?" sel":"")+'" data-a="day" data-k="'+k+'"><b>'+x.getDate()+'</b>'+l.slice(0,2).map(chip).join("")+(l.length>2?'<small>+'+(l.length-2)+'</small>':"")+'</div>'}
    h+='</div>'}
  else if(S.view==="week"){
    var m2=mon(S.sel);h+='<div class="scroll"><div class="grid week">';
    for(var j=0;j<7;j++){var y=new Date(m2);y.setDate(m2.getDate()+j);var k2=iso(y);
      h+='<div class="wcol" style="'+(k2===today?"background:var(--today)":"")+'" data-a="day" data-k="'+k2+'"><b>'+y.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric"})+'</b>'+evs(k2).map(chip).join("")+'</div>'}
    h+='</div></div>'}
  else{h+=evrows(evs(S.sel))}
  h+='</div>';
  if(S.view!=="dag"){var l3=evs(S.sel);if(l3.length)h+='<div class="card"><h2>'+D(S.sel).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})+'</h2>'+evrows(l3)+'</div>'}
  if(S.view==="dag")h+='<div class="card">'+evform()+'</div>';
  if(S.modal&&S.view!=="dag")h+=modal();
  return h}
function evform(){var e=S.eid?data.events.find(function(x){return x.id===S.eid}):null;e=e||{};
  return '<h2>'+(e.id?"Afspraak aanpassen":"Nieuwe afspraak")+'</h2><div class="row"><input class="w" id="et" placeholder="Wat" value="'+esc(e.title||"")+'"><input type="date" id="ed" value="'+(e.date||S.sel)+'"><select id="eh"><option value="">Uur</option>'+nopts(0,23,1)+'</select><select id="em"><option value="">Min</option>'+nopts(0,55,5)+'</select><select id="ew">'+opts()+'</select><select id="er"><option value="">Eenmalig</option><option value="d">Elke dag</option><option value="w">Elke week</option><option value="m">Elke maand</option><option value="y">Elk jaar</option></select><button class="primary" data-a="saveev">'+(e.id?"Opslaan":"Toevoegen")+'</button>'+(e.id?'<button data-a="cancelev">Annuleer</button>':'')+'</div>'}
function fillev(){if(!S.eid||!$("et"))return;var e=data.events.find(function(x){return x.id===S.eid});if(!e)return;var t=(e.time||"").split(":");$("eh").value=t[0]||"";$("em").value=t[1]||"";$("ew").value=e.who||"";$("er").value=e.rep||""}
function evrows(l){var R={d:"elke dag",w:"elke week",m:"elke maand",y:"elk jaar"};return l.length?l.map(function(e){return '<div class="item bar" style="border-color:'+col(e.who)+'"><div>'+esc(e.title)+(e.rep?" ↻":"")+'<br><small>'+(e.time?esc(e.time):"hele dag")+(e.who?" · "+esc(pname(e.who)):"")+(e.rep?" · "+R[e.rep]:"")+'</small></div>'+(e.ext?'<small>🔗 '+esc(e.src||"")+'</small>':'<span class="row"><button class="x" data-a="editev" data-id="'+esc(e.id)+'">✏️</button><button class="x" data-a="delev" data-id="'+esc(e.id)+'">Wis</button></span>')+'</div>'}).join(""):'<div class="note">Niets gepland op deze dag.</div>'}
function modal(){return '<div class="ov" data-a="close"><div class="mb" data-a="noop"><div class="head"><h2 style="text-align:left">'+D(S.sel).toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})+'</h2><button data-a="close">✕</button></div>'+evrows(evs(S.sel))+'<div style="margin-top:14px">'+evform()+'</div></div></div>'}
var DAYS=[[1,"ma"],[2,"di"],[3,"wo"],[4,"do"],[5,"vr"],[6,"za"],[0,"zo"]];
function dayOk(t){return !t.days||t.days.split(",").indexOf(String(new Date().getDay()))>=0}
function dlab(t){var d=(t.days||"").split(",").filter(Boolean);if(!d.length||d.length>=7)return "Dagelijks";return DAYS.filter(function(x){return d.indexOf(String(x[0]))>=0}).map(function(x){return x[1]}).join(" ")}
var EM=[["tand","🪥"],["douche","🚿"],["bad","🛁"],["pyjama","😴"],["slap","😴"],["bed","🛏️"],["afwas","🍽️"],["vaatwas","🍽️"],["opruim","🧸"],["kamer","🧸"],["huiswerk","📚"],["lees","📖"],["ontbijt","🥣"],["eten","🍽️"],["boodschap","🛒"],["stofzuig","🧹"],["veeg","🧹"],["vuilnis","🗑️"],["afval","🗑️"],["plant","🪴"],["hond","🐶"],["kat","🐱"],["was","🧺"],["kleed","👕"],["tas","🎒"],["schoen","👟"],["haar","💇"]];
function emo(t){t=t.toLowerCase();for(var i=0;i<EM.length;i++)if(t.indexOf(EM[i][0])>=0)return EM[i][1];return "⭐"}
var PARTS=[["ochtend","☀️ Ochtend"],["middag","🌤️ Middag"],["avond","🌙 Avond"],["klusjes","🧹 Klusjes"]];
function tint(c){return "color-mix(in srgb,"+c+" 22%,var(--card))"}
function isDone(t){return t.doneOn===iso(new Date())}
function cols(){
  var today=iso(new Date()),yd=new Date();yd.setDate(yd.getDate()-1);var yk=iso(yd),h='<div class="cols">';
  data.people.filter(function(p){return !S.who||p.id===S.who}).forEach(function(p){
    var l=data.tasks.filter(function(t){return t.who===p.id&&(t.daily?dayOk(t):t.date===today)}),n=l.filter(isDone).length;
    h+='<div class="col" style="background:'+tint(p.color)+'"><div class="ph"><div class="av" style="border:3px solid '+esc(p.color)+'">'+esc(p.emoji||"🙂")+'</div><div><div class="pn">'+esc(p.name)+'</div><span class="pill">✓ '+n+'/'+l.length+'</span> <span class="pill">⭐ '+(p.stars||0)+'</span>'+(p.streak>1&&p.lastFull>=yk?' <span class="pill">🔥 '+p.streak+'</span>':'')+'</div></div>';
    PARTS.forEach(function(pt){var g=l.filter(function(t){return (t.part||"klusjes")===pt[0]});if(!g.length)return;
      h+='<div class="part">'+pt[1]+'</div>'+g.map(function(t){var d=isDone(t);
        return '<div class="t'+(d?" done":"")+'" data-a="tog" data-c="tasks" data-id="'+esc(t.id)+'"><div style="display:flex;align-items:center;gap:12px"><span style="font-size:2.2rem">'+esc(t.emoji||emo(t.title))+'</span><div><div class="tt">'+esc(t.title)+'</div><small>'+(t.daily?dlab(t):"Vandaag")+' · ⭐ '+(t.stars||1)+'</small></div></div>'+(S.edit?'<button class="x" data-a="deltask" data-id="'+esc(t.id)+'">✕</button>':'<div class="ck" style="'+(d?"background:"+esc(p.color)+";border-color:"+esc(p.color):"")+'">'+(d?"✓":"")+'</div>')+'</div>'}).join("")});

async function start(){var s=await sb.auth.getSession();var u=s.data.session.user;window.U=u;me=(u.user_metadata&&u.user_metadata.name)||(u.email||"").split("@")[0];db=mkdb();await load();sb.channel("docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},function(){load()}).subscribe();note("Gesynchroniseerd");wxLoad();if(window.Notification&&Notification.permission==="granted")pushOn()}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&sb&&db)load()});
function login(){$("app").innerHTML='<div class="card" style="max-width:420px;margin:30px auto"><h2>Inloggen</h2><div class="row"><input class="w" id="le" type="email" placeholder="E-mail" autocomplete="username"><input class="w" id="lp" type="password" placeholder="Wachtwoord" autocomplete="current-password"><button class="primary" id="lb">Inloggen</button><button id="lr">Account maken</button></div><div class="note" id="lm"></div></div>';
  function go(up){var e=val("le"),p=$("lp").value;if(!e||p.length<6){$("lm").textContent="Vul je e-mail en een wachtwoord van minimaal 6 tekens in.";return}
    (up?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p})).then(function(r){if(r.error){$("lm").textContent=r.error.message;return}if(r.data.session)start();else $("lm").textContent="Account gemaakt. Log nu in."})}
  $("lb").onclick=function(){go(false)};$("lr").onclick=function(){go(true)}}
