<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2b2b;--muted:#8a8478;--line:#e8e2d8;--accent:#3a7bd5;--today:#e8f0fc;--sel:#d6e4fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 14px;min-height:44px}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chip{border-radius:20px;padding:6px 12px;min-height:38px}

.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}

:root{--bg:#fff4e6;--accent:#ff7a59;--sel:#ffe0d6;--today:#fff0c9}

:root{--bgg:linear-gradient(170deg,#7fd8ff 0%,#aee9ef 24%,#e6d9ff 58%,#ffd1e6 100%);--bg:rgba(255,255,255,.75);--text:#2f2a5a;--muted:#6f6a96;--card:rgba(255,255,255,.6);--line:rgba(255,255,255,.9);--accent:#6c63ff;--today:rgba(255,255,255,.9);--sel:rgba(124,107,255,.25);--grad:linear-gradient(135deg,#00b8d9,#8a6bff);--mb:rgba(255,255,255,.94)}

:root[data-theme="dark"]{--bgg:linear-gradient(170deg,#0d3a5c,#2a2a72 58%,#4b2a66);--bg:rgba(255,255,255,.14);--text:#f1eeff;--muted:#b4aedd;--card:rgba(255,255,255,.13);--line:rgba(255,255,255,.24);--accent:#9d8cff;--today:rgba(255,255,255,.22);--sel:rgba(157,140,255,.38);--mb:rgba(40,34,92,.95)}
html{background:var(--bgg);background-attachment:fixed;min-height:100%}
body{background:transparent;color:var(--text)}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:-1}
body::before{width:240px;height:240px;left:-70px;top:140px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),rgba(255,255,255,.06))}
body::after{width:190px;height:190px;right:-55px;bottom:190px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,.05))}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:34px 34px 34px 10px;box-shadow:0 8px 24px rgba(80,70,160,.13)}

button.on,button.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(108,99,255,.35)}
input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:999px;padding-left:14px}
#hd{font-size:1.3rem;font-weight:800;line-height:1.15}.head{flex-wrap:nowrap}.head small{font-size:.7rem;line-height:1.1}
.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--line);border-radius:999px;background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 8px 24px rgba(80,70,160,.2)}
.tabs button{border-radius:999px;box-shadow:none;background:none;color:var(--text)}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(108,99,255,.4)}
.fab{background:var(--grad);box-shadow:0 8px 22px rgba(108,99,255,.5)}
.day{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.8);border-radius:22px 22px 22px 8px}

.day.sel{background:linear-gradient(135deg,rgba(0,184,217,.25),rgba(138,107,255,.32));border-color:#8a6bff}
.ev{border-radius:999px;padding:1px 7px}
.wcol{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.8);border-radius:26px 26px 26px 8px}

.t{background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:30px 30px 30px 8px;box-shadow:0 4px 0 rgba(120,110,200,.14)}
.t.done{opacity:.85}
.ck{border:3px solid rgba(255,255,255,.95);background:rgba(255,255,255,.65);box-shadow:0 0 14px rgba(255,255,255,.9)}
.pill{border-radius:999px;background:rgba(255,255,255,.78);color:#2f2a5a}
.av{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 6px 14px rgba(0,0,0,.12)}
.item{border-bottom:1px solid var(--line)}
.ov{background:rgba(30,25,80,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mb{background:var(--mb);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:38px 38px 0 0}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before,:root:not([data-theme="light"]) body::after{opacity:.3}}
:root[data-theme="dark"] body::before,:root[data-theme="dark"] body::after{opacity:.3}
@media (min-width:800px){#hd{font-size:1.7rem}.tabs{top:12px;left:12px;right:auto;bottom:auto;width:88px;border-radius:44px;border:1px solid var(--line)}.tabs button{border-radius:28px}.mb{border-radius:38px}}
.gi{cursor:pointer}.gie{font-size:1.9rem}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.gt{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:24px;padding:8px 2px;min-height:78px}.gt span{font-size:2rem;line-height:1}.gt small{font-size:.68rem;font-weight:700}
.goal{margin:6px 4px 0;font-size:.85rem}.gb{height:10px;border-radius:9px;background:rgba(0,0,0,.1);overflow:hidden;margin-top:4px}.gb i{display:block;height:100%;background:var(--grad)}
.t.pend{outline:3px dashed #f5b700;outline-offset:-3px}
.kid .po,.kid [data-a=delev],.kid [data-a=editev],.kid [data-a=edit],.kid [data-a=fab],.kid [data-a=delrew],.kid [data-a=redeem],.kid [data-a=deltask],.kid [data-a=addp]{display:none!important}

<body>
<div class="head"><h1 id="hd">Gezinsagenda</h1><span id="wx" style="font-weight:800;white-space:nowrap"></span><small id="note"></small><button id="lk" style="min-height:40px;padding:4px 12px" aria-label="Ouderstand">🔓</button><button id="meb" style="min-height:40px;padding:4px 12px" aria-label="Profiel">👤</button><button id="bell" style="min-height:40px;padding:4px 12px" aria-label="Meldingen">🔔</button><button id="th" style="min-height:40px;padding:4px 12px" aria-label="Thema wisselen">🌓</button></div>
<div id="app"></div>
<input type="file" id="phfile" accept="image/*" multiple hidden><input type="file" id="avfile" accept="image/*" hidden><input type="file" id="rsfile" accept=".json,application/json" hidden>
<div class="note" style="text-align:center;margin:16px 0 90px">Versie 20</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var data={people:[],events:[],tasks:[],items:[],meals:[],rewards:[],feeds:[],settings:[],log:[],rules:[]},db=null,dirty=false;
var S={tab:"agenda",view:"maand",sel:iso(new Date()),who:"",addp:false};
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function D(k){return new Date(k+"T12:00:00")}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function $(i){return document.getElementById(i)}
function val(i){var e=$(i);return e?e.value.trim():""}
function col(id){var p=data.people.find(function(x){return x.id===id});return p?p.color:"#8a8478"}
function pname(id){var p=data.people.find(function(x){return x.id===id});return p?p.name:""}
function note(t){$("note").textContent=t}
function add(c,o){if(db){db.collection(c).add(o).catch(function(){note("Opslaan mislukt (schrijfrechten?)")})}else{o.id="l"+Math.random();data[c].push(o);render()}}
function del(c,id){if(db){db.collection(c).doc(id).delete().catch(function(){note("Wissen mislukt")})}else{data[c]=data[c].filter(function(x){return x.id!==id});render()}}
function put(c,id,o){if(db){db.collection(c).doc(id).set(o).catch(function(){note("Opslaan mislukt")})}else{o.id=id;var i=data[c].findIndex(function(x){return x.id===id});if(i<0)data[c].push(o);else data[c][i]=o;render()}}
function upd(c,id,patch){var it=data[c].find(function(x){return x.id===id});if(!it)return;var n={};for(var k in it)if(k!=="id")n[k]=it[k];for(var k2 in patch)n[k2]=patch[k2];put(c,id,n)}
function hits(e,k){if(e.date===k)return true;if(!e.rep||k<e.date)return false;var a=D(e.date),b=D(k);
  if(e.rep==="d")return true;
  if(e.rep==="w")return Math.round((b-a)/864e5)%7===0;
  if(e.rep==="m")return a.getDate()===b.getDate();
  if(e.rep==="y")return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  return false}
function evs(k){return data.events.filter(function(e){return hits(e,k)&&(!S.who||e.who===S.who)}).concat(EXT.filter(function(e){return e.date===k&&(!S.who||e.who===S.who)})).concat(S.who?[]:holEv(k)).sort(function(a,b){return (a.time||"").localeCompare(b.time||"")})}
function chip(e,nt){return '<div class="ev" style="background:'+(e.ic?"#f0a500":col(e.who))+'">'+(e.time&&!nt?esc(e.time)+" ":"")+(e.ext?(e.ic||"📚")+" ":"")+esc(e.title)+(e.rep?' ↻':'')+'</div>'}
function nopts(a,b,st){var h="";for(var i=a;i<=b;i+=st)h+='<option>'+String(i).padStart(2,"0")+'</option>';return h}
function opts(){return data.people.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'}).join("")}
function wk(d){var x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);var y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y)/864e5+1)/7)}
function mon(k){var x=D(k);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function people(){
  var h='<div class="row" style="margin-bottom:10px"><button class="chip'+(S.who?"":" on")+'" data-a="who" data-id="">Iedereen</button>';
  data.people.forEach(function(p){h+='<button class="chip'+(S.who===p.id?" on":"")+'" data-a="who" data-id="'+esc(p.id)+'">'+av(p)+' '+esc(p.name)+'</button>'});
  h+='<button class="chip" data-a="addp">+ Persoon</button></div>';
  if(S.addp||!data.people.length)h+='<div class="card row"><input class="w" id="pn" placeholder="Naam (bijv. Mama)"><select id="pe">'+"🐶🐱🦊🐸🦁🐼🦄🐯🐰🐵".match(/./gu).map(function(e){return '<option>'+e+'</option>'}).join("")+'</select><input type="color" id="pc" value="#ff7a59"><button class="primary" data-a="savep">Opslaan</button></div>';
  return h}
function agenda(){
  var h=cdBar()+'<div class="row po" style="margin-bottom:10px"><input class="w" id="qa" placeholder="Snel toevoegen: zwemmen morgen 16:30"><button class="primary" data-a="qa">+</button></div><div class="row" style="margin-bottom:10px">'+["dag","week","maand"].map(function(v){return '<button class="'+(S.view===v?"on":"")+'" data-a="view" data-v="'+v+'">'+v+'</button>'}).join("")+'</div><div class="card"><div class="head"><button data-a="nav" data-n="-1">‹</button>';
  var d=D(S.sel),t;
  if(S.view==="maand")t=d.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
  else if(S.view==="week"){var m=mon(S.sel),e=new Date(m);e.setDate(m.getDate()+6);t="Week "+wk(m)+" · "+m.getDate()+" – "+e.toLocaleDateString("nl-NL",{day:"numeric",month:"long"})}
  else t=d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"});
  h+='<h2>'+t+'</h2><button data-a="nav" data-n="0">Vandaag</button><button data-a="nav" data-n="1">›</button></div>';
  var today=iso(new Date());
  if(S.view==="maand"){
    var f=new Date(d.getFullYear(),d.getMonth(),1,12),st=new Date(f);st.setDate(1-((f.getDay()+6)%7));
